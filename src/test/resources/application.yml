server:
  port: 0
  servlet:
    context-path: /api/v1

spring:
  application:
    name: medical-system-test
  datasource:
    url: jdbc:h2:mem:drmayday_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      mode: always
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: validate
    open-in-view: false
