server:
  port: 8081

spring:
  datasource:
    url: jdbc:h2:mem:mayday_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false
    hibernate:
      ddl-auto: validate
  sql:
    init:
      mode: always

mayday:
  test-adapter-token: ${MAYDAY_TEST_ADAPTER_TOKEN:}
