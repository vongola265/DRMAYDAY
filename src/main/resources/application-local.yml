server:
  address: 127.0.0.1
  port: 8081

spring:
  servlet:
    multipart:
      max-file-size: 11MB
      max-request-size: 25MB

  datasource:
    url: jdbc:postgresql://127.0.0.1:55432/mayday_test
    username: postgres
    password: ""
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-local.sql
